[tool.poetry]
name = "langgraph_react_agent_tfsa"
version = "1.0.0"
description = "Answers TFSA-related questions using certified policy knowledge."
authors = ["Jerry Shao <jerry.shao@ibm.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src", from = "watsonx_ai" }
]


[tool.poetry.dependencies]
python = ">=3.10,<3.13"
python-dotenv = "^1.0.1"
langgraph = ">0.2,<0.3"
langchain = "0.3.25"
langchain-community = "0.3.27"
langchain-core = "0.3.72"
langchain_openai = "0.3.28"
langchain-ibm = "^0.3.15"
langchain-deepseek = "0.1.4"
langchain-ollama = "0.3.6"
langchain-tavily = "0.2.11"
duckduckgo-search = "8.1.0"
ibm-watsonx-ai = { version = ">=1.3.32", python = ">=3.11,<3.13" }
ibm-watson-machine-learning = "1.0.368"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
