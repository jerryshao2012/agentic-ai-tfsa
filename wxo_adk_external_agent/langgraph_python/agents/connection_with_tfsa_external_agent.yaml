kind: native
name: Connection_with_TFSA_External_Agent
display_name: Connect to TFSA External Agent
description: Connect with a collaborator, `TFSA_External_LangGraph_Agent`, to answer
  user queries for Tax-Free Savings Accounts (TFSAs)
context_access_enabled: true
context_variables: []
llm: watsonx/meta-llama/llama-3-2-90b-vision-instruct
style: default
instructions: '1. Invoke the collaborator `TFSA_External_LangGraph_Agent` to get the answer for the use''s question about the Tax-Free Savings Accounts (TFSAs).
2. Provide an answer to the user using a professional but conversational tone based on the response from the collaborator `TFSA_External_LangGraph_Agent`.
3. Never expose internal collaborator names or reasoning steps.'
guidelines: []
collaborators:
- TFSA_External_LangGraph_Agent
tools: []
knowledge_base: []
chat_with_docs:
  enabled: false
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
  generation:
    prompt_instruction: ''
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
spec_version: v1
